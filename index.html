function fmtDuration(ms,withSeconds=false){let sec=Math.max(0,Math.floor(ms/1000));const h=Math.floor(sec/3600);sec%=3600;const m=Math.floor(sec/60);sec%=60;return [h,m,sec].map(v=>String(v).padStart(2,'0')).join(':').replace(/[0-9]/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);}
function fmtHM(ms){let m=Math.round(Math.max(0,ms)/60000);let h=Math.floor(m/60);m%=60;return h?`${fa(h)} ساعت ${fa(m)} دقیقه`:`${fa(m)} دقیقه`;}
function dateParts(ts=Date.now()){const parts=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Tehran',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',weekday:'short',hourCycle:'h23'}).formatToParts(new Date(ts));const o={};parts.forEach(p=>o[p.type]=p.value);return o;}
function scheduleForKey(key){const weekday=new Date(key+'T12:00:00Z').getUTCDay();return state.weeklySchedule?.[String(weekday)]||{startHour:5,startMinute:0,endHour:5,endMinute:0};}
function dateKey(ts=Date.now()){const p=dateParts(ts);let d=new Date(Date.UTC(+p.year,+p.month-1,+p.day));const key=d.toISOString().slice(0,10),schedule=scheduleForKey(key),nowMinutes=(+p.hour*60)+(+p.minute),startMinutes=schedule.startHour*60+schedule.startMinute;if(nowMinutes<startMinutes)d.setUTCDate(d.getUTCDate()-1);return d.toISOString().slice(0,10)}
function addDays(key,amount){const d=new Date(key+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+amount);return d.toISOString().slice(0,10)}
function weekStart(key=dateKey()){const d=new Date(key+'T12:00:00Z');const off=(d.getUTCDay()+1)%7;return addDays(key,-off)}
function faDate(key,style='medium'){const d=new Date(key+'T12:00:00Z');return new Intl.DateTimeFormat('fa-IR-u-ca-persian',{timeZone:'UTC',dateStyle:style}).format(d)}
function dayName(key){return new Intl.DateTimeFormat('fa-IR-u-ca-persian',{timeZone:'UTC',weekday:'long'}).format(new Date(key+'T12:00:00Z'))}
function timeTehran(ts){return new Intl.DateTimeFormat('fa-IR',{timeZone:'Asia/Tehran',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).format(new Date(ts))}
function tehranTimeForStudyDay(dayKey,clock){
 const match=/^(\d{2}):(\d{2})$/.exec(clock||'');
 if(!match)return NaN;
 const hour=Number(match[1]),minute=Number(match[2]);
 if(hour>23||minute>59)return NaN;
 const schedule=scheduleForKey(dayKey),boundary=schedule.startHour*60+schedule.startMinute;
 const calendarKey=hour*60+minute<boundary?addDays(dayKey,1):dayKey;
 const [year,month,day]=calendarKey.split('-').map(Number);
 // Asia/Tehran is UTC+03:30 for the recent dates available in the streak calendar.
 return Date.UTC(year,month-1,day,hour,minute)-210*60000;
}
function manualInterval(dayKey,startClock,endClock){
 const startAt=tehranTimeForStudyDay(dayKey,startClock);
 let endAt=tehranTimeForStudyDay(dayKey,endClock);
 if(!Number.isFinite(startAt)||!Number.isFinite(endAt))return {error:'زمان شروع یا پایان معتبر نیست.'};
 if(startClock===endClock)return {error:'ساعت شروع و پایان نمی‌تواند یکسان باشد.'};
 if(endAt<=startAt)endAt+=86400000;
 const duration=endAt-startAt;
 if(duration<=0||duration>86400000)return {error:'مدت پارت باید بیشتر از صفر و حداکثر ۲۴ ساعت باشد.'};
 return {startAt,endAt,duration};
}
function findTimeOverlap(startAt,endAt){
 const session=state.sessions.find(s=>{
  const sStart=Number(s.startAt),sEnd=Number.isFinite(Number(s.endAt))?Number(s.endAt):sStart+Number(s.totalMs||0);
  return Number.isFinite(sStart)&&Number.isFinite(sEnd)&&startAt<sEnd&&endAt>sStart;
 });
 if(session)return {kind:'session',session};
 const timer=state.timer;
 if(timer?.context?.startAt){
  const tStart=Number(timer.context.startAt);
  const tEnd=timer.running?Date.now():tStart+Number(timer.elapsedMs||0);
  if(startAt<tEnd&&endAt>tStart)return {kind:'timer'};
 }
 return null;
}
function overlapWarning(overlap){
 if(overlap?.kind==='timer')return 'این بازه با پارت فعال کرنومتر تداخل دارد؛ ابتدا آن پارت را متوقف یا ثبت کن.';
 const s=overlap?.session;
 return s?`این بازه با پارت «${s.subject}» (${timeTehran(s.startAt)} تا ${timeTehran(s.endAt||s.startAt+s.totalMs)}) تداخل دارد؛ پارت جدید ثبت نشد.`:'بازهٔ زمانی با یک پارت دیگر تداخل دارد؛ پارت جدید ثبت نشد.';
}

function studyDaySessions(key=dateKey()){return state.sessions.filter(s=>s.dayKey===key)}
function sum(arr,fn){return arr.reduce((a,x)=>a+(fn?fn(x):x),0)}
function todayTotal(){return sum(studyDaySessions(),s=>s.totalMs)}
function todayUseful(){return sum(studyDaySessions(),s=>s.usefulMs)}
function getSubject(name){return SUBJECTS.find(x=>x.name===name)||{name,icon:'✦',color:'#999'}}
function getStudyDays(){return [...new Set(state.sessions.map(s=>s.dayKey))]}
function hasStudy(key){return state.sessions.some(s=>s.dayKey===key)}
function hasEarlyStudy(key){return state.sessions.some(s=>s.dayKey===key && isEarly(s.startAt))}
function isEarly(ts){const p=dateParts(ts);return +p.hour>=5 && +p.hour<9;}
function streakCount(early=false){let n=0,k=dateKey();if(!hasStudy(k) && !(early&&hasEarlyStudy(k)))k=addDays(k,-1);while(early?hasEarlyStudy(k):hasStudy(k)){n++;k=addDays(k,-1);if(n>400)break;}return n;}
function weekSessions(offset=0){const start=addDays(weekStart(),-7*offset);const end=addDays(start,7);return {start,end,sessions:state.sessions.filter(s=>s.dayKey>=start&&s.dayKey<end)};}
function weekStats(sessions){const total=sum(sessions,s=>s.totalMs),useful=sum(sessions,s=>s.usefulMs),tests=sessions.filter(s=>s.tests&&s.tests.count>0),avg=tests.length?sum(tests,s=>s.tests.percent)/tests.length:null;return {total,useful,parts:sessions.length,testsCount:sum(tests,s=>s.tests.count),correct:sum(tests,s=>s.tests.correct),wrong:sum(tests,s=>s.tests.wrong),blank:sum(tests,s=>s.tests.blank),essay:sum(sessions,s=>s.essayCount||0),avg,quality:sessions.length?sum(sessions,s=>s.quality)/sessions.length:null};}

function tehranCalendarKey(){const p=dateParts();return `${p.year}-${p.month}-${p.day}`;}
function eventCountdownInfo(){const ev=state.eventCountdown;if(!ev?.title||!/^\d{4}-\d{2}-\d{2}$/.test(ev.date||''))return null;const today=tehranCalendarKey();const [y,m,d]=today.split('-').map(Number),[ey,em,ed]=ev.date.split('-').map(Number);const days=Math.round((Date.UTC(ey,em-1,ed)-Date.UTC(y,m-1,d))/86400000);return {title:ev.title,date:ev.date,days};}

function persianMonthToken(key){
 const parts=new Intl.DateTimeFormat('en-US-u-ca-persian',{timeZone:'UTC',year:'numeric',month:'numeric'}).formatToParts(new Date(key+'T12:00:00Z'));
 const year=parts.find(x=>x.type==='year')?.value||'0';
 const month=parts.find(x=>x.type==='month')?.value||'0';
 return `${year}-${String(month).padStart(2,'0')}`;
}
function persianMonthLabel(key){return new Intl.DateTimeFormat('fa-IR-u-ca-persian',{timeZone:'UTC',year:'numeric',month:'long'}).format(new Date(key+'T12:00:00Z'));}
function shiftedPersianMonthKey(offset){
 let key=dateKey(),token=persianMonthToken(key),direction=offset>=0?-1:1;
 for(let n=0;n<Math.min(240,Math.abs(offset));n++){
  let cursor=key,guard=0;
  do{cursor=addDays(cursor,direction);guard++;}while(persianMonthToken(cursor)===token&&guard<40);
  key=cursor;token=persianMonthToken(key);
 }
 return key;
}
function sharePeriodData(){
 const period=['day','week','month'].includes(state.statsPeriod)?state.statsPeriod:'day';
 let sessions=[],label='',subtitle='';
 if(period==='day'){
  const offset=Math.max(0,Math.min(10000,Number(state.statsDayOffset)||0));
  const key=addDays(dateKey(),-offset);sessions=state.sessions.filter(x=>x.dayKey===key);
  label=offset===0?'امروز':dayName(key);subtitle=faDate(key);
 }else if(period==='week'){
  const offset=Math.max(0,Math.min(1000,Number(state.reportWeekOffset)||0));
  const start=addDays(weekStart(),-7*offset),end=addDays(start,7);
  sessions=state.sessions.filter(x=>x.dayKey>=start&&x.dayKey<end);
  label=offset===0?'این هفته':`${fa(offset)} هفته قبل`;subtitle=`${faDate(start)} تا ${faDate(addDays(end,-1))}`;
 }else{
  const offset=Math.max(0,Math.min(240,Number(state.statsMonthOffset)||0));
  const anchor=shiftedPersianMonthKey(offset),token=persianMonthToken(anchor);
  sessions=state.sessions.filter(x=>persianMonthToken(x.dayKey)===token);
  label=offset===0?'این ماه':persianMonthLabel(anchor);subtitle=persianMonthLabel(anchor);
 }
 const rows=SUBJECTS.map(subject=>({subject,ms:sum(sessions.filter(x=>x.subject===subject.name),x=>x.totalMs)}))
  .filter(x=>x.ms>0).sort((a,b)=>b.ms-a.ms);
 return {period,sessions,label,subtitle,rows,total:sum(rows,x=>x.ms)};
}
function renderSubjectSharePanel(){
 const data=sharePeriodData(),circ=2*Math.PI*66;let offset=0;
 const segments=data.total?data.rows.map(row=>{
  const pct=row.ms/data.total,arc=circ*pct,start=offset;offset+=arc;
  const labelAngle=(-90+(start+arc/2)/circ*360)*Math.PI/180;
  const labelX=90+62*Math.cos(labelAngle),labelY=90+62*Math.sin(labelAngle);
  return `<circle cx="90" cy="90" r="66" fill="none" stroke="${row.subject.color}" stroke-width="25" stroke-dasharray="${arc.toFixed(2)} ${(circ-arc).toFixed(2)}" stroke-dashoffset="-${start.toFixed(2)}" transform="rotate(-90 90 90)"/>${pct>=.075?`<text x="${labelX.toFixed(1)}" y="${(labelY+3).toFixed(1)}" text-anchor="middle" class="share-segment-label">${fa(Math.round(pct*100))}٪</text>`:''}`;
 }).join(''):`<circle cx="90" cy="90" r="66" fill="none" stroke="var(--line)" stroke-width="25"/>`;
 const legend=data.rows.length?data.rows.map(row=>{
  const pct=data.total?row.ms/data.total*100:0;
  return `<div class="share-legend-row"><i style="background:${row.subject.color}"></i><strong title="${esc(row.subject.name)}">${esc(row.subject.name)}</strong><span>${fmtDuration(row.ms)}</span><b>${fa(pct.toFixed(1))}٪</b></div>`;
 }).join(''):`<div class="share-empty">در این بازه هنوز مطالعه‌ای ثبت نشده است.</div>`;
 const active=p=>data.period===p?'active':'';
 const offsetValue=data.period==='day'?(Number(state.statsDayOffset)||0):data.period==='week'?(Number(state.reportWeekOffset)||0):(Number(state.statsMonthOffset)||0);
 return `<section class="panel share-panel"><div class="section-head" style="margin-top:0"><div><h3>سهم هر درس از زمان مطالعه</h3><small>درصد زمان اختصاص‌یافته به هر درس</small></div><span class="share-total">${fmtDuration(data.total)}</span></div><div class="share-period-tabs"><button class="${active('day')}" data-action="share-period" data-period="day">روز</button><button class="${active('week')}" data-action="share-period" data-period="week">هفته</button><button class="${active('month')}" data-action="share-period" data-period="month">ماه</button></div><div class="share-period-nav"><button data-action="share-period-prev" aria-label="بازه قبل">‹</button><div><strong>${data.label}</strong><small>${data.subtitle}</small></div><button data-action="share-period-next" ${offsetValue===0?'disabled':''} aria-label="بازه بعد">›</button></div><div class="share-content"><div class="share-donut"><svg viewBox="0 0 180 180" role="img" aria-label="نمودار سهم درس‌ها">${segments}<circle cx="90" cy="90" r="48" fill="var(--panel)"/><text x="90" y="85" text-anchor="middle" class="share-center-title">مطالعه کل</text><text x="90" y="105" text-anchor="middle" class="share-center-value">${fmtHM(data.total)}</text></svg></div><div class="share-legend">${legend}</div></div></section>`;
}

function renderReport(){const {start,end,sessions}=weekSessions(state.reportWeekOffset);const st=weekStats(sessions);const days=Array.from({length:7},(_,i)=>addDays(start,i));const dayTotals=days.map(k=>sum(sessions.filter(s=>s.dayKey===k),s=>s.totalMs));const max=Math.max(...dayTotals,3600000);const bars=days.map((k,i)=>`<div class="chart-col"><b>${dayTotals[i]?fmtDuration(dayTotals[i]).slice(0,5):'۰'}</b><div class="chart-bar-wrap"><div class="chart-bar" style="height:${Math.max(2,dayTotals[i]/max*100)}%"></div></div><small>${dayName(k).replace('شنبه','ش').replace('یکشنبه','ی').replace('دوشنبه','د').replace('سه‌شنبه','س').replace('چهارشنبه','چ').replace('پنجشنبه','پ').replace('جمعه','ج')}</small></div>`).join('');const subjects=SUBJECTS.map(s=>({s,ms:sum(sessions.filter(x=>x.subject===s.name),x=>x.totalMs)})).filter(x=>x.ms>0).sort((a,b)=>b.ms-a.ms);const maxSub=Math.max(1,...subjects.map(x=>x.ms));return `<div class="report-banner"><div><h2>گزارش کار و عملکرد مطالعاتی</h2><p>از ${faDate(start)} تا ${faDate(addDays(end,-1))} · بازه هفتگی</p></div><div class="brand-mark">◉</div></div>${renderSubjectSharePanel()}<div class="section-head"><div><h2>خلاصهٔ هفته</h2><small>آمار پارت‌های ثبت‌شده</small></div><div class="week-switch"><button data-action="week-prev">‹</button><span class="tiny">${state.reportWeekOffset===0?'هفته جاری':`${fa(state.reportWeekOffset)} هفته قبل`}</span><button data-action="week-next" ${state.reportWeekOffset===0?'disabled':''}>›</button></div></div><div class="report-stats"><div class="report-stat"><span>مطالعه کل هفته</span><strong>${fmtDuration(st.total)}</strong></div><div class="report-stat"><span>مطالعه مفید</span><strong>${fmtDuration(st.useful)}</strong></div><div class="report-stat"><span>میانگین درصد پاسخ‌گویی</span><strong>${st.avg===null?'—':fa(st.avg.toFixed(1))+'٪'}</strong></div><div class="report-stat"><span>پارت‌های مطالعه</span><strong>${fa(st.parts)}</strong></div></div><section class="panel"><div class="section-head" style="margin-top:0"><h3>ساعات مطالعه هفتگی</h3><small>زمان کل هر روز</small></div><div class="chart">${bars}</div></section><div class="grid grid-2" style="margin-top:12px"><section class="panel"><div class="section-head" style="margin-top:0"><h3>سوالات این هفته</h3></div><div class="grid grid-2"><div class="stat"><span class="label">تستی</span><strong>${fa(st.testsCount)}</strong></div><div class="stat"><span class="label">تشریحی</span><strong>${fa(st.essay)}</strong></div><div class="stat"><span class="label">درست</span><strong>${fa(st.correct)}</strong></div><div class="stat"><span class="label">اشتباه</span><strong>${fa(st.wrong)}</strong></div></div></section><section class="panel"><div class="section-head" style="margin-top:0"><h3>تفکیک درس‌ها</h3></div>${subjects.length?`<div class="subject-breakdown">${subjects.map(x=>`<div class="break-row"><span>${esc(x.s.name)}</span><div class="break-track"><span style="width:${x.ms/maxSub*100}%"></span></div><b>${fmtDuration(x.ms)}</b></div>`).join('')}</div>`:`<div class="empty-state">هنوز اطلاعاتی ثبت نشده</div>`}</section></div><section class="panel"><div class="section-head" style="margin-top:0"><h3>جزئیات روزانهٔ هفته</h3><small>مرز روز: طبق برنامه هفتگی</small></div><div class="report-table-wrap"><table class="report-table"><thead><tr><th>روز</th><th>تاریخ</th><th>شروع اولین پارت</th><th>پایان آخرین پارت</th><th>مطالعه کل</th><th>مفید</th><th>تستی</th><th>تشریحی</th></tr></thead><tbody>${days.map(k=>{const ds=sessions.filter(s=>s.dayKey===k).sort((a,b)=>a.startAt-b.startAt);return `<tr><td>${dayName(k)}</td><td>${faDate(k)}</td><td>${ds.length?timeTehran(ds[0].startAt):'—'}</td><td>${ds.length?timeTehran(ds[ds.length-1].endAt):'—'}</td><td>${fmtDuration(sum(ds,s=>s.totalMs))}</td><td>${fmtDuration(sum(ds,s=>s.usefulMs))}</td><td>${fa(sum(ds,s=>s.tests?.count||0))}</td><td>${fa(sum(ds,s=>s.essayCount||0))}</td></tr>`}).join('')}</tbody></table></div></section><section class="panel"><div class="section-head" style="margin-top:0"><h3>پارت‌های ثبت‌شده</h3><small>${fa(sessions.length)} پارت</small></div>${sessions.length?`<div class="session-list">${sessions.slice().sort((a,b)=>b.startAt-a.startAt).map(sessionRow).join('')}</div>`:`<div class="empty-state">برای این هفته پارت مطالعاتی ثبت نشده است.</div>`}</section><div style="display:flex;justify-content:flex-end;margin:14px 0"><button class="btn btn-primary" data-action="export-pdf">▣ دریافت گزارش هفتگی PDF</button></div>`;}

function deleteCustomSubject(name){if(state.timer?.context?.subject===name){closeModal();notify('ابتدا پارت فعال این درس را پایان بده.','error');return;}const before=state.customSubjects.length;state.customSubjects=state.customSubjects.filter(x=>x.name!==name);if(state.customSubjects.length===before){closeModal();notify('درس موردنظر پیدا نشد.','error');return;}syncSubjects();saveState();closeModal();render();notify(`درس «${name}» از فهرست حذف شد؛ سوابق قبلی حفظ شدند.`);}
function clockDigits(value){return String(value).replace(/[0-9]/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);}
function scheduleClock(hour,minute){return `${clockDigits(String(hour).padStart(2,'0'))}:${clockDigits(String(minute).padStart(2,'0'))}`;}
function scheduleSummary(v){const start=v.startHour*60+v.startMinute,end=v.endHour*60+v.endMinute;return `شروع ${scheduleClock(v.startHour,v.startMinute)} · پایان ${scheduleClock(v.endHour,v.endMinute)}${end<=start?' · روز بعد':''}`;}
function renderScheduleSlider(day,part,unit,label,min,max,value){const id=`sched-${day.key}-${part}-${unit}`;return `<div class="schedule-control"><div class="schedule-control-head"><label for="${id}">${label}</label><output id="${id}-value">${fa(value)}</output></div><input id="${id}" type="range" min="${min}" max="${max}" step="1" value="${value}" data-schedule-day="${day.key}" data-schedule-part="${part}" data-schedule-unit="${unit}"></div>`;}
function renderWeeklySchedule(){return `<div class="weekly-schedule-block"><div class="section-head" style="margin-top:0"><div><h3>برنامه روزانه هفته</h3><small>برای هر روز، ساعت شروع و پایان دلخواهت را تنظیم کن</small></div><span style="font-size:23px">🗓️</span></div><p class="small muted" style="margin:0 0 12px">ساعت‌ها بر اساس وقت تهران هستند. ساعت شروع هر روز، مرز محاسبه روز مطالعاتی را تعیین می‌کند؛ ساعت پایان، پایان بازه برنامه‌ریزی‌شده است. اگر پایان زودتر یا مساوی شروع باشد، پایان مربوط به روز بعد است.</p><div class="weekly-schedule-list">${WEEK_DAYS.map(day=>{const v=state.weeklySchedule[String(day.key)]||{startHour:5,startMinute:0,endHour:5,endMinute:0};return `<article class="schedule-day-card"><div class="schedule-day-head"><strong>${day.label}</strong><span class="schedule-summary" id="schedule-summary-${day.key}">${scheduleSummary(v)}</span></div><div class="schedule-controls">${renderScheduleSlider(day,'start','hour','ساعت شروع',0,23,v.startHour)}${renderScheduleSlider(day,'start','minute','دقیقه شروع',0,59,v.startMinute)}${renderScheduleSlider(day,'end','hour','ساعت پایان',0,23,v.endHour)}${renderScheduleSlider(day,'end','minute','دقیقه پایان',0,59,v.endMinute)}</div></article>`;}).join('')}</div></div>`;}
function readScheduleControls(dayKey){const val=(part,unit)=>Number(document.getElementById(`sched-${dayKey}-${part}-${unit}`).value);return {startHour:val('start','hour'),startMinute:val('start','minute'),endHour:val('end','hour'),endMinute:val('end','minute')};}
function refreshSchedulePreview(dayKey){const v=readScheduleControls(dayKey);['start-hour','start-minute','end-hour','end-minute'].forEach(key=>{const el=document.getElementById(`sched-${dayKey}-${key}-value`);if(el){const [part,unit]=key.split('-');el.textContent=fa(v[part+ (unit==='hour'?'Hour':'Minute')]);}});const summary=document.getElementById(`schedule-summary-${dayKey}`);if(summary)summary.textContent=scheduleSummary(v);}
function planClock(hour,minute){return `${fa(hour).padStart(2,'۰')}:${fa(minute).padStart(2,'۰')}`;}
function renderPlanTimeSlider(part,unit,label,value,max){const id=`plan-${part}-${unit}`;return `<div class="schedule-control"><div class="schedule-control-head"><label for="${id}">${label}</label><output id="${id}-value">${fa(value)}</output></div><input id="${id}" type="range" min="0" max="${max}" step="1" value="${value}" data-plan-time="${part}" data-plan-unit="${unit}"></div>`;}
function renderPlanTimeModal(){const d=planDraft||{dayKey:6,startHour:8,startMinute:0,endHour:9,endMinute:0};return `<div class="modal-head"><div><h3>زمان‌بندی پارت مطالعه</h3><div class="muted tiny">ابتدا روز و ساعت مطالعه را مشخص کن</div></div><button class="close-btn" data-action="close-modal">×</button></div><form id="plan-time-form"><div class="field"><label for="plan-day">روز هفته</label><select id="plan-day">${WEEK_DAYS.map(x=>`<option value="${x.key}" ${String(d.dayKey)===String(x.key)?'selected':''}>${x.label}</option>`).join('')}</select></div><div class="schedule-controls" style="margin-top:14px">${renderPlanTimeSlider('start','hour','ساعت شروع',d.startHour,23)}${renderPlanTimeSlider('start','minute','دقیقه شروع',d.startMinute,59)}${renderPlanTimeSlider('end','hour','ساعت پایان',d.endHour,23)}${renderPlanTimeSlider('end','minute','دقیقه پایان',d.endMinute,59)}</div><p class="tiny muted" style="margin:10px 0 0">اگر ساعت پایان از شروع زودتر باشد، پارت به روز بعد ادامه پیدا می‌کند.</p><div id="plan-time-error" class="form-error" style="margin-top:8px"></div><div class="modal-actions"><button class="btn btn-primary" type="submit">ادامه و تعیین جزئیات</button><button class="btn btn-soft" type="button" data-action="close-modal">انصراف</button></div></form>`;}
function planChapterOptions(subject,grade,selected=''){const chapters=subject==='حسابان'?(CURRICULUM['حسابان']?.['12']?.chapters||GENERIC_CHAPTERS):(CURRICULUM[subject]?.[grade]?.chapters||GENERIC_CHAPTERS);return chapters.map(x=>`<option ${x===selected?'selected':''}>${esc(x)}</option>`).join('')+`<option ${selected==='مبحث آزاد / خارج از فصل'?'selected':''}>مبحث آزاد / خارج از فصل</option>`;}
function renderPlanDetailsModal(){const d=planDraft,subject=d.subject||'حسابان',grade=d.grade||'12';const tests=!!d.tests;return `<div class="modal-head"><div><h3>جزئیات پارت برنامه‌ریزی‌شده</h3><div class="muted tiny">${WEEK_DAYS.find(x=>String(x.key)===String(d.dayKey))?.label||'روز'} · ${planClock(d.startHour,d.startMinute)} تا ${planClock(d.endHour,d.endMinute)}</div></div><button class="close-btn" data-action="close-modal">×</button></div><form id="plan-details-form"><div class="form-grid"><div class="field"><label for="plan-subject">چه درسی؟</label><select id="plan-subject">${SUBJECTS.map(x=>`<option ${x.name===subject?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div><div class="field"><label for="plan-grade">پایهٔ تحصیلی</label><select id="plan-grade"><option value="10" ${grade==='10'?'selected':''}>دهم</option><option value="11" ${grade==='11'?'selected':''}>یازدهم</option><option value="12" ${grade==='12'?'selected':''}>دوازدهم</option></select></div><div class="field full" id="plan-chapter-wrap"><label for="plan-chapter">چه فصلی؟</label><select id="plan-chapter">${planChapterOptions(subject,grade,d.chapter||'')}</select></div><div class="field full"><label for="plan-topic">چه مبحثی؟</label><input id="plan-topic" maxlength="120" placeholder="مثلاً: معادله درجه دوم" value="${esc(d.topic||'')}"></div><div class="field full"><label>حل تست؟</label><div class="type-chips"><button type="button" class="type-chip ${tests?'':'selected'}" data-action="plan-test-choice" data-value="no" id="plan-test-no">خیر</button><button type="button" class="type-chip ${tests?'selected':''}" data-action="plan-test-choice" data-value="yes" id="plan-test-yes">بله</button></div></div><div class="field full ${tests?'':'hidden'}" id="plan-test-count-wrap"><label for="plan-test-count">تعداد تست موردنیاز</label><input id="plan-test-count" type="number" min="1" max="10000" step="1" value="${d.testCount||20}" placeholder="مثلاً ۳۰"></div><div class="field full"><label>حل سؤال تشریحی؟</label><div class="type-chips"><button type="button" class="type-chip ${d.essay?'':'selected'}" data-action="plan-essay-choice" data-value="no" id="plan-essay-no">خیر</button><button type="button" class="type-chip ${d.essay?'selected':''}" data-action="plan-essay-choice" data-value="yes" id="plan-essay-yes">بله</button></div></div></div><div id="plan-details-error" class="form-error" style="margin-top:8px"></div><div class="modal-actions"><button class="btn btn-primary" type="submit">ذخیره در برنامه</button><button class="btn btn-soft" type="button" data-action="plan-time-back">بازگشت به زمان</button></div></form>`;}
function renderPlannedSchedule(){const blocks=Array.isArray(state.plannedBlocks)?state.plannedBlocks:[];return `<div class="weekly-schedule-block"><div class="section-head" style="margin-top:0"><div><h3>برنامه‌ریزی پارت‌های مطالعه</h3><small>برای هر روز، ساعت و موضوع هر پارت را جداگانه مشخص کن</small></div><button class="btn btn-primary btn-sm" data-action="add-planned-block">＋ افزودن پارت</button></div><p class="small muted" style="margin:0 0 12px">برای هر پارت، زمان شروع و پایان را با اسلایدر تعیین کن؛ سپس درس، فصل، مبحث و هدف تستی یا تشریحی را ثبت کن.</p>${blocks.length?`<div class="planned-block-list">${WEEK_DAYS.map(day=>{const dayBlocks=blocks.filter(x=>String(x.dayKey)===String(day.key)).sort((a,b)=>(a.startHour*60+a.startMinute)-(b.startHour*60+b.startMinute));return dayBlocks.length?`<div class="planned-day-group"><strong>${day.label}</strong>${dayBlocks.map(x=>`<article class="planned-block-card"><div class="planned-block-time">${planClock(x.startHour,x.startMinute)} – ${planClock(x.endHour,x.endMinute)}${x.endHour*60+x.endMinute<x.startHour*60+x.startMinute?' · روز بعد':''}</div><div class="planned-block-info"><b>${esc(x.subject)}</b><span>${esc(x.chapter||'—')}${x.topic?' · '+esc(x.topic):''}</span><small>${x.tests?`🎯 ${fa(x.testCount)} تست`: 'بدون تست'} · ${x.essay?'سؤال تشریحی':'بدون سؤال تشریحی'}</small></div><button class="btn btn-red btn-sm" data-action="delete-planned-block" data-id="${esc(x.id)}" aria-label="حذف پارت">حذف</button></article>`).join('')}</div>`:''}).join('')}</div>`:`<div class="empty-state" style="padding:15px"><strong>هنوز پارت برنامه‌ریزی‌شده‌ای ثبت نکرده‌ای</strong><div class="tiny">با «افزودن پارت» اولین بازهٔ مطالعه‌ات را بساز.</div></div>`}</div>`;}
function updatePlanChapterOptions(){if(!planDraft)return;const subject=document.getElementById('plan-subject')?.value||'حسابان',grade=subject==='حسابان'?'12':(document.getElementById('plan-grade')?.value||'12');const current=document.getElementById('plan-chapter')?.value||'';const wrap=document.getElementById('plan-chapter-wrap');if(wrap)wrap.innerHTML=`<label for="plan-chapter">چه فصلی؟</label><select id="plan-chapter">${planChapterOptions(subject,grade,current)}</select>`;}
function savePlannedBlock(){const subject=document.getElementById('plan-subject').value;const grade=subject==='حسابان'?'12':document.getElementById('plan-grade').value;const chapter=document.getElementById('plan-chapter').value;const topic=document.getElementById('plan-topic').value.trim();const tests=document.getElementById('plan-test-yes').classList.contains('selected');const essay=document.getElementById('plan-essay-yes').classList.contains('selected');let testCount=0;if(tests){testCount=Number(document.getElementById('plan-test-count').value);if(!Number.isInteger(testCount)||testCount<1||testCount>10000){const err=document.getElementById('plan-details-error');if(err)err.textContent='تعداد تست موردنیاز باید بین ۱ تا ۱۰٬۰۰۰ باشد.';return;}}
 const block={id:crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random(),dayKey:Number(planDraft.dayKey),startHour:planDraft.startHour,startMinute:planDraft.startMinute,endHour:planDraft.endHour,endMinute:planDraft.endMinute,subject,grade,chapter,topic,tests,testCount,essay};state.plannedBlocks.push(block);saveState();planDraft=null;closeModal();render();notify('پارت به برنامه روزانه اضافه شد.');}

<div class="personal-bg-tools"><div class="personal-bg-tool"><strong>پس‌زمینه هدر سایت</strong><small>تصویر دلخواه فقط برای سربرگ بالا</small><div><label class="btn btn-soft btn-sm" for="header-wallpaper-file">انتخاب تصویر</label><input id="header-wallpaper-file" type="file" accept="image/*" class="hidden">${state.headerWallpaper?'<button class="btn btn-red btn-sm" data-action="remove-header-wallpaper">حذف تصویر</button>':''}</div></div><div class="personal-bg-tool"><strong>پس‌زمینه کرنومتر</strong><small>تصویر دلخواه فقط برای صفحه کرنومتر</small><div><label class="btn btn-soft btn-sm" for="timer-wallpaper-file">انتخاب تصویر</label><input id="timer-wallpaper-file" type="file" accept="image/*" class="hidden">${state.timerWallpaper?'<button class="btn btn-red btn-sm" data-action="remove-timer-wallpaper">حذف تصویر</button>':''}</div></div></div>
<section class="panel event-settings"><div class="section-head" style="margin:0"><div><h3>روزشمار رویداد</h3><small>یک مناسبت یا آزمون را انتخاب کن تا شمارش معکوس آن در صفحه اصلی نمایش داده شود.</small></div><span>🗓️</span></div><form id="event-form" class="form-grid"><div class="field"><label for="event-title">عنوان رویداد</label><input class="input" id="event-title" maxlength="60" placeholder="مثلاً آزمون آزمایشی" value="${esc(state.eventCountdown?.title||'')}"></div><div class="field"><label for="event-date">تاریخ رویداد</label><input class="input" id="event-date" type="date" required value="${esc(state.eventCountdown?.date||'')}"></div><div class="field full"><button class="btn btn-primary" type="submit">ذخیره روزشمار</button>${state.eventCountdown?'<button class="btn btn-red btn-sm" type="button" data-action="clear-event">حذف رویداد</button>':''}</div></form></section>
${renderWeeklySchedule()}${renderPlannedSchedule()}<div class="settings-row"><div><strong>پشتیبان‌گیری از اطلاعات</strong><div class="muted tiny">خروجی و بازیابی تمام پارت‌ها و تنظیمات</div></div><div style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn btn-soft btn-sm" data-action="backup">خروجی JSON</button><label for="restore-file" class="btn btn-soft btn-sm">بازیابی</label><input id="restore-file" class="hidden" type="file" accept="application/json"></div></div></section><section class="panel" style="margin-top:13px"><div class="section-head" style="margin-top:0"><div><h3>مدیریت دروس</h3><small>درس‌های موردنظرت را به فهرست برنامه اضافه کن</small></div><button class="btn btn-soft btn-sm" data-action="add-subject">＋ افزودن درس</button></div>${state.customSubjects.length?`<div class="subject-list">${state.customSubjects.map(x=>`<div class="subject-card"><div class="subject-icon" style="--subject-color:${x.color}">${esc(x.icon)}</div><div class="subject-info"><strong>${esc(x.name)}</strong><small>درس افزوده‌شده توسط شما</small></div><button class="btn btn-red btn-sm" data-action="delete-custom-subject" data-subject="${esc(x.name)}" aria-label="حذف درس ${esc(x.name)}">حذف</button></div>`).join('')}</div>`:`<div class="empty-state" style="padding:15px"><strong>هنوز درسی اضافه نکرده‌ای</strong><div class="tiny">با گزینهٔ افزودن درس، فهرست را کامل کن.</div></div>`}</section><section class="panel"><h3 style="margin:0 0 8px">راهنمای محاسبه</h3><p class="small muted" style="margin:0">درصد پاسخ‌گویی تست‌ها طبق فرمول نمره منفی محاسبه می‌شود:</p><div dir="ltr" style="text-align:center;padding:14px;background:var(--panel2);border-radius:12px;margin-top:10px;font-weight:900;color:var(--green)">(3 × correct − wrong) ÷ (3 × total) × 100</div><p class="tiny muted">سوالات بدون پاسخ در تعداد کل سوالات لحاظ می‌شوند و امتیاز منفی نمی‌گیرند.</p></section>`;}
function openModal(html){document.getElementById('modal-root').innerHTML=`<div class="modal-backdrop" data-action="backdrop-close"><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`;}
function closeModal(){document.getElementById('modal-root').innerHTML='';modalDraft=null;}
function renderFinishModal(totalMs,context){modalDraft={totalMs,context};return `<div class="modal-head"><div><h3>ثبت جزئیات پارت مطالعه</h3>${context.manualInterval?`<div class="muted tiny">${faDate(context.dayKey)} · ${timeTehran(context.startAt)} تا ${timeTehran(context.endAt)}</div>`:''}</div><button class="close-btn" data-action="close-modal">×</button></div><form id="finish-form"><div class="form-grid"><div class="field"><label>مدت زمان کل مطالعه (دقیقه)</label><input type="number" id="finish-total" min="1" max="1440" value="${Math.max(1,Math.round(totalMs/60000))}" ${context.manualInterval?'readonly':''} required></div><div class="field"><label>مدت زمان مفید مطالعه (دقیقه)</label><input type="number" id="finish-useful" min="0" max="1440" value="${Math.max(0,Math.round(totalMs/60000))}" required></div><div class="field full"><label>آیا تست کار کردی؟</label><div class="type-chips"><button class="type-chip selected" type="button" data-action="test-choice" data-value="no" id="test-no">خیر</button><button class="type-chip" type="button" data-action="test-choice" data-value="yes" id="test-yes">بله</button></div></div><div id="test-fields" class="full hidden"><div class="form-grid"><div class="field"><label>تعداد کل تست‌ها</label><input type="number" id="test-count" min="1" value="20"></div><div class="field"><label>پاسخ درست</label><input type="number" id="test-correct" min="0" value="0"></div><div class="field"><label>پاسخ اشتباه</label><input type="number" id="test-wrong" min="0" value="0"></div><div class="field"><label>بدون پاسخ</label><input type="number" id="test-blank" min="0" value="20"></div></div><div class="tiny muted" id="test-hint" style="margin-top:6px">جمع درست، اشتباه و بدون پاسخ باید برابر تعداد کل تست‌ها باشد.</div></div><div class="field full"><label>آیا سوال تشریحی حل کردی؟</label><div class="type-chips"><button class="type-chip selected" type="button" data-action="essay-choice" data-value="no" id="essay-no">خیر</button><button class="type-chip" type="button" data-action="essay-choice" data-value="yes" id="essay-yes">بله</button></div></div><div id="essay-fields" class="field full hidden"><label>تعداد سوالات تشریحی</label><input type="number" id="essay-count" min="0" value="0"></div><div class="field full"><label>از صد درصد، چند درصد یادگرفتی؟ 👓</label><div class="range-wrap"><input type="range" id="quality" min="0" max="100" value="75"><span class="range-value" id="quality-value">۷۵٪</span></div></div><div class="full field"><label>موضوع مطالعه</label><input id="finish-topic" maxlength="120" value="${esc(context.topic||'')}" placeholder="موضوع یا نکتهٔ این پارت"></div></div><div id="finish-error" class="tiny" style="color:#ff8290;margin-top:9px"></div><div class="modal-actions"><button class="btn btn-primary" type="submit">ثبت پارت ✓</button><button class="btn btn-soft" type="button" data-action="close-modal">انصراف</button></div></form>`;}
function beginSetup(subject='حسابان',manual=false,dayKey=dateKey()){setupDraft=makeSetupDraft(subject,manual,dayKey);nav('setup');}
function openFinish(totalMs,context){const html=renderFinishModal(totalMs,context);openModal(html);}
function saveSessionFromForm(){const totalMin=+document.getElementById('finish-total').value;const usefulMin=+document.getElementById('finish-useful').value;const quality=+document.getElementById('quality').value;const testsYes=document.getElementById('test-yes').classList.contains('selected');const essayYes=document.getElementById('essay-yes').classList.contains('selected');if(!Number.isFinite(totalMin)||totalMin<1||totalMin>1440){showFinishError('مدت زمان کل باید بین ۱ تا ۱۴۴۰ دقیقه باشد.');return;}if(!Number.isFinite(usefulMin)||usefulMin<0||usefulMin>totalMin){showFinishError('مدت زمان مفید باید بین صفر و مدت زمان کل باشد.');return;}let tests=null;if(testsYes){const count=+document.getElementById('test-count').value,correct=+document.getElementById('test-correct').value,wrong=+document.getElementById('test-wrong').value,blank=+document.getElementById('test-blank').value;if([count,correct,wrong,blank].some(x=>!Number.isInteger(x)||x<0)||count<1){showFinishError('تعداد تست‌ها باید عدد صحیح و تعداد کل بیشتر از صفر باشد.');return;}if(correct+wrong+blank!==count){showFinishError(`جمع پاسخ‌ها (${fa(correct+wrong+blank)}) باید با تعداد کل تست‌ها (${fa(count)}) برابر باشد.`);return;}const percent=((3*correct-wrong)/(3*count))*100;tests={count,correct,wrong,blank,percent};}let essayCount=0;if(essayYes){essayCount=+document.getElementById('essay-count').value;if(!Number.isInteger(essayCount)||essayCount<0){showFinishError('تعداد سوالات تشریحی نامعتبر است.');return;}}
const now=Date.now(),context=modalDraft.context;const startAt=context.startAt||now-totalMin*60000;const endAt=context.endAt||now;const totalMs=context.manualInterval?endAt-startAt:totalMin*60000;if(context.manualInterval){const overlap=findTimeOverlap(startAt,endAt);if(overlap){showFinishError(overlapWarning(overlap));return;}}const session={id:crypto.randomUUID?crypto.randomUUID():String(now)+Math.random(),subject:context.subject,grade:context.grade,book:context.book||'',chapter:context.chapter||'',topic:document.getElementById('finish-topic').value.trim(),types:context.types||[],totalMs,usefulMs:usefulMin*60000,tests,essayCount,quality,startAt,endAt,dayKey:context.dayKey||dateKey(startAt)};state.sessions.push(session);if(!context.manualInterval)state.timer=null;saveState();closeModal();setupDraft=null;notify('پارت مطالعه با موفقیت ثبت شد 🌱');nav(context.returnView||'dashboard');}
function showFinishError(msg){const e=document.getElementById('finish-error');if(e)e.textContent=msg;}
function detailModal(id){const s=state.sessions.find(x=>x.id===id);if(!s)return;const sub=getSubject(s.subject);const test=s.tests?`<div class="stat"><span class="label">تعداد تست</span><strong>${fa(s.tests.count)}</strong></div><div class="stat"><span class="label">درست / غلط / نزده</span><strong>${fa(s.tests.correct)} / ${fa(s.tests.wrong)} / ${fa(s.tests.blank)}</strong></div><div class="stat"><span class="label">درصد پاسخ‌گویی</span><strong>${fa(s.tests.percent.toFixed(1))}٪</strong></div>`:'<div class="muted small">تستی ثبت نشده است.</div>';openModal(`<div class="modal-head"><div><h3>${esc(s.subject)} · جزئیات پارت</h3><div class="muted tiny">${faDate(s.dayKey)} · ${timeTehran(s.startAt)} تا ${timeTehran(s.endAt)}</div></div><button class="close-btn" data-action="close-modal">×</button></div><div class="grid grid-2"><div class="stat"><span class="label">مدت کل</span><strong>${fmtDuration(s.totalMs)}</strong></div><div class="stat"><span class="label">مدت مفید</span><strong>${fmtDuration(s.usefulMs)}</strong></div><div class="stat"><span class="label">کیفیت یادگیری</span><strong>${fa(s.quality)}٪</strong></div><div class="stat"><span class="label">سوال تشریحی</span><strong>${fa(s.essayCount||0)}</strong></div></div><div class="panel" style="margin-top:12px;background:var(--panel2)"><div class="small"><b>پایه:</b> ${s.grade==='10'?'دهم':s.grade==='11'?'یازدهم':'دوازدهم'} · <b>کتاب:</b> ${esc(s.book||'بدون کتاب')}</div><div class="small" style="margin-top:5px"><b>فصل:</b> ${esc(s.chapter||'—')}</div><div class="small" style="margin-top:5px"><b>مبحث:</b> ${esc(s.topic||'—')}</div><div class="small" style="margin-top:5px"><b>نوع مطالعه:</b> ${esc((s.types||[]).join('، ')||'—')}</div></div><div class="section-head"><h3>عملکرد تستی</h3></div>${test}<div class="modal-actions"><button class="btn btn-red" data-action="delete-session" data-id="${s.id}">حذف این پارت</button><button class="btn btn-soft" data-action="close-modal">بستن</button></div>`);}
function confirmDelete(id){const s=state.sessions.find(x=>x.id===id);if(!s)return;openModal(`<div class="modal-head"><h3>حذف پارت مطالعه</h3><button class="close-btn" data-action="close-modal">×</button></div><p class="small muted">پارت «${esc(s.subject)}» برای همیشه از گزارش‌ها حذف شود؟</p><div class="modal-actions"><button class="btn btn-red" data-action="confirm-delete" data-id="${id}">بله، حذف کن</button><button class="btn btn-soft" data-action="close-modal">انصراف</button></div>`);}
function exportReport(){const {start,end,sessions}=weekSessions(state.reportWeekOffset);const st=weekStats(sessions);const days=Array.from({length:7},(_,i)=>addDays(start,i));const bars=days.map(k=>({k,v:sum(sessions.filter(s=>s.dayKey===k),s=>s.totalMs)}));const max=Math.max(1,...bars.map(x=>x.v));const root=document.getElementById('print-report');root.innerHTML=`<div class="pr-head"><div><b>◉ روتین روزانه</b><div style="font-size:10px">گزارش عملکرد مطالعاتی</div></div><div class="pr-title"><h1>گزارش کار و عملکرد مطالعاتی</h1><p>از ${faDate(start)} تا ${faDate(addDays(end,-1))} · روز مطالعاتی طبق برنامه هفتگی</p></div><div class="pr-user">${esc(state.displayName||'دانش‌آموز')}<br>دانش‌آموز</div></div><div class="pr-stats"><div class="pr-stat"><small>مطالعه کل هفته</small><strong>${fmtDuration(st.total)}</strong></div><div class="pr-stat"><small>مطالعه مفید</small><strong>${fmtDuration(st.useful)}</strong></div><div class="pr-stat"><small>میانگین درصد پاسخ‌گویی</small><strong>${st.avg===null?'—':fa(st.avg.toFixed(1))+'٪'}</strong></div><div class="pr-stat"><small>پارت مطالعاتی</small><strong>${fa(st.parts)}</strong></div></div><section class="pr-section"><h2>ساعات مطالعه هفتگی</h2><div class="pr-chart">${bars.map(x=>`<div class="pr-bar-col"><b style="font-size:9px;color:#4b8d5d">${x.v?fmtDuration(x.v):'۰'}</b><div class="pr-bar" style="height:${Math.max(2,x.v/max*100)}%"></div><small>${dayName(x.k)}</small></div>`).join('')}</div></section><section class="pr-section"><h2>خلاصه عملکرد سوالات</h2><table class="pr-table"><tr><th>تعداد تست</th><th>درست</th><th>اشتباه</th><th>بدون پاسخ</th><th>سوال تشریحی</th><th>پارت‌ها</th></tr><tr><td>${fa(st.testsCount)}</td><td>${fa(st.correct)}</td><td>${fa(st.wrong)}</td><td>${fa(st.blank)}</td><td>${fa(st.essay)}</td><td>${fa(st.parts)}</td></tr></table></section><section class="pr-section"><h2>جزئیات روزانه هفته</h2><table class="pr-table"><thead><tr><th>روز</th><th>تاریخ</th><th>شروع</th><th>پایان</th><th>مطالعه کل</th><th>مطالعه مفید</th><th>تستی</th><th>تشریحی</th></tr></thead><tbody>${days.map(k=>{const ds=sessions.filter(s=>s.dayKey===k).sort((a,b)=>a.startAt-b.startAt);return `<tr><td>${dayName(k)}</td><td>${faDate(k)}</td><td>${ds.length?timeTehran(ds[0].startAt):'—'}</td><td>${ds.length?timeTehran(ds.at(-1).endAt):'—'}</td><td>${fmtDuration(sum(ds,s=>s.totalMs))}</td><td>${fmtDuration(sum(ds,s=>s.usefulMs))}</td><td>${fa(sum(ds,s=>s.tests?.count||0))}</td><td>${fa(sum(ds,s=>s.essayCount||0))}</td></tr>`}).join('')}</tbody></table></section><section class="pr-section"><h2>جزئیات پارت‌های مطالعه</h2><table class="pr-table"><thead><tr><th>درس</th><th>پایه / کتاب</th><th>فصل و مبحث</th><th>نوع مطالعه</th><th>مدت کل</th><th>مفید</th><th>کیفیت</th><th>درصد تست</th></tr></thead><tbody>${sessions.slice().sort((a,b)=>a.startAt-b.startAt).map(s=>`<tr><td>${esc(s.subject)}</td><td>${s.grade==='10'?'دهم':s.grade==='11'?'یازدهم':'دوازدهم'} / ${esc(s.book||'—')}</td><td>${esc(s.chapter||'—')}<br>${esc(s.topic||'')}</td><td>${esc((s.types||[]).join('، ')||'—')}</td><td>${fmtDuration(s.totalMs)}</td><td>${fmtDuration(s.usefulMs)}</td><td>${fa(s.quality)}٪</td><td>${s.tests?fa(s.tests.percent.toFixed(1))+'٪':'—'}</td></tr>`).join('')}</tbody></table></section><div class="pr-footer">گزارش تولیدشده توسط روتین روزانه · زمان‌بندی بر اساس ساعت تهران</div>`;setTimeout(()=>window.print(),100);}
function downloadFile(name,content,type){const blob=new Blob([content],{type});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function backup(){downloadFile('masir-motalehe-backup.json',JSON.stringify(state,null,2),'application/json');notify('فایل پشتیبان آماده شد.');}
function imageToData(file,maxSize=1600,quality=.78){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onerror=reject;reader.onload=()=>{const img=new Image();img.onload=()=>{const scale=Math.min(1,maxSize/Math.max(img.width,img.height));const canvas=document.createElement('canvas');canvas.width=Math.round(img.width*scale);canvas.height=Math.round(img.height*scale);canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);resolve(canvas.toDataURL('image/jpeg',quality));};img.onerror=reject;img.src=reader.result;};reader.readAsDataURL(file);});}
// delegated interactions
document.addEventListener('click',e=>{const btn=e.target.closest('[data-action],[data-view]');if(!btn)return;if(btn.dataset.view){nav(btn.dataset.view);return;}const a=btn.dataset.action;switch(a){case 'start-new':beginSetup('حسابان',false);break;case 'manual-add':beginSetup('حسابان',true);break;case 'add-subject':openAddSubjectModal();break;case 'add-planned-block':planDraft=null;openModal(renderPlanTimeModal());break;case 'plan-time-back':openModal(renderPlanTimeModal());break;case 'plan-test-choice':document.getElementById('plan-test-no').classList.toggle('selected',btn.dataset.value==='no');document.getElementById('plan-test-yes').classList.toggle('selected',btn.dataset.value==='yes');document.getElementById('plan-test-count-wrap').classList.toggle('hidden',btn.dataset.value!=='yes');break;case 'plan-essay-choice':document.getElementById('plan-essay-no').classList.toggle('selected',btn.dataset.value==='no');document.getElementById('plan-essay-yes').classList.toggle('selected',btn.dataset.value==='yes');break;case 'delete-planned-block':{const id=btn.dataset.id;openModal(`<div class="modal-head"><h3>حذف پارت برنامه</h3><button class="close-btn" data-action="close-modal">×</button></div><p class="small muted">این پارت از برنامه‌ریزی حذف شود؟</p><div class="modal-actions"><button class="btn btn-red" data-action="confirm-delete-planned-block" data-id="${esc(id)}">حذف پارت</button><button class="btn btn-soft" data-action="close-modal">انصراف</button></div>`);break;}case 'confirm-delete-planned-block':state.plannedBlocks=(state.plannedBlocks||[]).filter(x=>x.id!==btn.dataset.id);saveState();closeModal();render();notify('پارت برنامه حذف شد.');break;case 'delete-custom-subject':confirmDeleteCustomSubject(btn.dataset.subject);break;case 'confirm-delete-custom-subject':deleteCustomSubject(btn.dataset.subject);break;case 'quick-start':beginSetup(btn.dataset.subject||'حسابان',false);break;case 'streak-day':openStreakDayModal(btn.dataset.dayKey);break;case 'streak-day-add':{const key=btn.dataset.dayKey;closeModal();beginSetup('حسابان',true,key);setupDraft.returnView='streak';break;}case 'back-dashboard':setupDraft=null;nav('dashboard');break;case 'open-settings':nav('settings');break;case 'toggle-type':if(!setupDraft)break;setupDraft.types=setupDraft.types.includes(btn.dataset.type)?setupDraft.types.filter(x=>x!==btn.dataset.type):[...setupDraft.types,btn.dataset.type];btn.classList.toggle('selected');break;case 'toggle-pause':if(state.timer){if(state.timer.running){state.timer.elapsedMs=elapsedTimer();state.timer.running=false;state.timer.startedAt=null;}else{state.timer.running=true;state.timer.startedAt=Date.now();}saveState();render();}break;case 'finish-timer':if(state.timer){const total=elapsedTimer();const context={...state.timer.context};state.timer=null;saveState();openFinish(total,context);}break;case 'cancel-timer':openModal(`<div class="modal-head"><h3>لغو پارت فعال</h3><button class="close-btn" data-action="close-modal">×</button></div><p class="muted small">زمان ثبت‌شده برای این پارت ذخیره نخواهد شد. مطمئنی؟</p><div class="modal-actions"><button class="btn btn-red" data-action="confirm-cancel">لغو پارت</button><button class="btn btn-soft" data-action="close-modal">ادامه مطالعه</button></div>`);break;case 'confirm-cancel':state.timer=null;saveState();closeModal();notify('پارت لغو شد.');nav('dashboard');break;case 'session-detail':detailModal(btn.dataset.id);break;case 'close-modal':closeModal();break;case 'delete-session':confirmDelete(btn.dataset.id);break;case 'confirm-delete':state.sessions=state.sessions.filter(s=>s.id!==btn.dataset.id);saveState();closeModal();notify('پارت حذف شد.');render();break;case 'test-choice':document.getElementById('test-no').classList.toggle('selected',btn.dataset.value==='no');document.getElementById('test-yes').classList.toggle('selected',btn.dataset.value==='yes');document.getElementById('test-fields').classList.toggle('hidden',btn.dataset.value!=='yes');break;case 'essay-choice':document.getElementById('essay-no').classList.toggle('selected',btn.dataset.value==='no');document.getElementById('essay-yes').classList.toggle('selected',btn.dataset.value==='yes');document.getElementById('essay-fields').classList.toggle('hidden',btn.dataset.value!=='yes');break;case 'export-pdf':exportReport();break;case 'share-period':state.statsPeriod=btn.dataset.period;saveState();render();break;case 'share-period-prev':{const key=state.statsPeriod==='day'?'statsDayOffset':state.statsPeriod==='week'?'reportWeekOffset':'statsMonthOffset';state[key]=Math.max(0,Number(state[key])||0)+1;saveState();render();break;}case 'share-period-next':{const key=state.statsPeriod==='day'?'statsDayOffset':state.statsPeriod==='week'?'reportWeekOffset':'statsMonthOffset';state[key]=Math.max(0,(Number(state[key])||0)-1);saveState();render();break;}case 'week-prev':state.reportWeekOffset++;saveState();render();break;case 'week-next':state.reportWeekOffset=Math.max(0,state.reportWeekOffset-1);saveState();render();break;case 'theme':state.theme=btn.dataset.theme;saveState();render();break;case 'remove-wallpaper':state.wallpaper=null;saveState();render();notify('پس‌زمینه حذف شد.');break;case 'remove-header-wallpaper':state.headerWallpaper=null;saveState();render();notify('پس‌زمینه هدر حذف شد.');break;case 'remove-timer-wallpaper':state.timerWallpaper=null;saveState();render();notify('پس‌زمینه کرنومتر حذف شد.');break;case 'clear-event':state.eventCountdown=null;saveState();render();notify('روزشمار رویداد حذف شد.');break;case 'backup':backup();break;case 'backdrop-close':if(e.target===btn)closeModal();break;}});
document.addEventListener('change',e=>{if(e.target.matches('[data-schedule-day]')){const dayKey=e.target.dataset.scheduleDay;state.weeklySchedule[dayKey]=readScheduleControls(dayKey);saveState();const day=WEEK_DAYS.find(d=>String(d.key)===String(dayKey));notify(`برنامه ${day?.label||'روز'} ذخیره شد.`);}if(e.target.id==='plan-subject'){if(e.target.value==='حسابان'){const g=document.getElementById('plan-grade');if(g)g.value='12';}updatePlanChapterOptions();}if(e.target.id==='plan-grade'){updatePlanChapterOptions();}if(e.target.id==='setup-subject'){setupDraft.subject=e.target.value;setupDraft.grade=e.target.value==='حسابان'?'12':setupDraft.grade;const g=document.getElementById('setup-grade');if(g)g.value=setupDraft.grade;document.getElementById('setup-book-fields').innerHTML=renderBookFields();}if(e.target.id==='setup-grade'){setupDraft.grade=e.target.value;const chapters=CURRICULUM[setupDraft.subject]?.[setupDraft.grade]?.chapters||GENERIC_CHAPTERS;setupDraft.chapter=chapters[0];document.getElementById('setup-book-fields').innerHTML=renderBookFields();}if(['wallpaper-file','header-wallpaper-file','timer-wallpaper-file'].includes(e.target.id)&&e.target.files[0]){const field=e.target.id==='wallpaper-file'?'wallpaper':e.target.id==='header-wallpaper-file'?'headerWallpaper':'timerWallpaper';imageToData(e.target.files[0],field==='wallpaper'?1600:1300,field==='wallpaper'?.78:.74).then(data=>{state[field]=data;saveState();render();notify(field==='headerWallpaper'?'پس‌زمینه هدر تغییر کرد.':field==='timerWallpaper'?'پس‌زمینه کرنومتر تغییر کرد.':'پس‌زمینه با موفقیت تغییر کرد.');}).catch(()=>notify('بارگذاری تصویر انجام نشد.','error'));}if(e.target.id==='restore-file'&&e.target.files[0]){const file=e.target.files[0];const reader=new FileReader();reader.onload=()=>{try{const data=JSON.parse(reader.result);if(!Array.isArray(data.sessions))throw new Error('invalid');state={...structuredClone(DEFAULT),...data,headerWallpaper:data.headerWallpaper||null,timerWallpaper:data.timerWallpaper||null,eventCountdown:data.eventCountdown&&typeof data.eventCountdown==='object'?data.eventCountdown:null,customSubjects:Array.isArray(data.customSubjects)?data.customSubjects:[],weeklySchedule:normalizeWeeklySchedule(data.weeklySchedule),plannedBlocks:Array.isArray(data.plannedBlocks)?data.plannedBlocks:[]};syncSubjects();saveState();render();notify('اطلاعات بازیابی شد.');}catch(err){notify('فایل پشتیبان معتبر نیست.','error');}};reader.readAsText(file);}if(e.target.id==='goal-hours'){const v=+e.target.value;if(v>=.5&&v<=24){state.goalHours=v;saveState();notify('هدف روزانه به‌روزرسانی شد.');}}if(e.target.id==='display-name'){state.displayName=e.target.value.trim()||'دانش‌آموز';saveState();}});
document.addEventListener('input',e=>{if(e.target.matches('[data-schedule-day]'))refreshSchedulePreview(e.target.dataset.scheduleDay);if(e.target.matches('[data-plan-time]')){const key=`plan-${e.target.dataset.planTime}-${e.target.dataset.planUnit}-value`;const out=document.getElementById(key);if(out)out.textContent=fa(e.target.value);}if(e.target.id==='quality'){document.getElementById('quality-value').textContent=fa(e.target.value)+'٪';}if(e.target.id==='test-count'||e.target.id==='test-correct'||e.target.id==='test-wrong'||e.target.id==='test-blank'){const hint=document.getElementById('test-hint');if(hint){const c=+document.getElementById('test-count').value,co=+document.getElementById('test-correct').value,w=+document.getElementById('test-wrong').value,b=+document.getElementById('test-blank').value;hint.textContent=`مجموع پاسخ‌ها: ${fa(co+w+b)} از ${fa(c)} تست`;hint.style.color=co+w+b===c?'var(--green)':'var(--muted)';}}});
document.addEventListener('submit',e=>{if(e.target.id==='event-form'){e.preventDefault();const title=document.getElementById('event-title').value.trim(),date=document.getElementById('event-date').value;if(!title||!date){notify('عنوان و تاریخ رویداد را وارد کن.','error');return;}const [y,m,d]=date.split('-').map(Number);const check=new Date(Date.UTC(y,m-1,d));if(check.getUTCFullYear()!==y||check.getUTCMonth()!==m-1||check.getUTCDate()!==d){notify('تاریخ رویداد معتبر نیست.','error');return;}state.eventCountdown={title,date};saveState();render();notify('روزشمار رویداد ذخیره شد.');}if(e.target.id==='plan-time-form'){e.preventDefault();const get=(p,u)=>Number(document.getElementById(`plan-${p}-${u}`).value);const startHour=get('start','hour'),startMinute=get('start','minute'),endHour=get('end','hour'),endMinute=get('end','minute');if(startHour===endHour&&startMinute===endMinute){const err=document.getElementById('plan-time-error');if(err)err.textContent='ساعت شروع و پایان نمی‌تواند یکسان باشد.';return;}planDraft={...(planDraft||{}),dayKey:Number(document.getElementById('plan-day').value),startHour,startMinute,endHour,endMinute};openModal(renderPlanDetailsModal());}if(e.target.id==='plan-details-form'){e.preventDefault();savePlannedBlock();}if(e.target.id==='custom-subject-form'){e.preventDefault();saveCustomSubjectFromForm();}if(e.target.id==='setup-form'){e.preventDefault();const subject=document.getElementById('setup-subject').value;const grade=document.getElementById('setup-grade').value;const book=document.getElementById('setup-book')?.value||'';const chapter=document.getElementById('setup-chapter')?.value||'';const topic=document.getElementById('setup-topic').value.trim();const types=[...document.querySelectorAll('.type-chip.selected')].map(x=>x.dataset.type).filter(Boolean);const context={subject,grade,book:subject==='حسابان'?'':book,chapter,topic,types,startAt:Date.now()};if(setupDraft.manual){const interval=manualInterval(setupDraft.dayKey,document.getElementById('manual-start-time').value,document.getElementById('manual-end-time').value);if(interval.error){notify(interval.error,'error');return;}const overlap=findTimeOverlap(interval.startAt,interval.endAt);if(overlap){notify(overlapWarning(overlap),'error');return;}context.startAt=interval.startAt;context.endAt=interval.endAt;context.dayKey=setupDraft.dayKey;context.manualInterval=true;context.returnView=setupDraft.returnView||'dashboard';openFinish(interval.duration,context);}else{state.timer={running:true,startedAt:Date.now(),elapsedMs:0,context};saveState();setupDraft=null;nav('timer');notify('کرنومتر شروع شد؛ موفق باشی!');}}if(e.target.id==='finish-form'){e.preventDefault();saveSessionFromForm();}});
document.getElementById('floating-add').addEventListener('click',()=>beginSetup('حسابان',true));
// Resume timer after reload; elapsed time is based on a timestamp.
if(state.timer&&state.timer.running&&state.timer.startedAt){state.timer.running=true;}
applyTheme();render();tickTimer=setInterval(()=>{if(state.timer?.running&&activeView==='timer')updateTimerDisplay();},500);
})();
